<!doctype html><html lang="ja"><meta charset="utf-8"><title>Alto M6 — lyon / vello 比較</title><style>body{font:15px/1.6 system-ui;background:#151821;color:#e9eef9;margin:32px;max-width:1000px}button{padding:10px 16px;margin:10px}pre{white-space:pre-wrap}a{color:#b9ccff}</style><h1>M6 — lyon / vello 比較</h1><p>同じ100本のパスを512×512へ描画します。初回描画後、3フレームのウォームアップと20フレームの測定を行います。編集エンジン全体の性能比較ではありません。</p><button id="run">比較を実行</button><button id="save" disabled>比較結果を保存</button><pre id="result">待機中</pre><p><a href="../browser-playground/">Playgroundへ戻る</a></p><script type="module">let report;document.querySelector('#run').onclick=async()=>{const b=document.querySelector('#run'),out=document.querySelector('#result');b.disabled=true;out.textContent='比較用Workerを実行中…';const worker=new Worker('./worker.js',{type:'module'});worker.onmessage=({data})=>{b.disabled=false;worker.terminate();if(data.error){out.textContent=data.error;return;}report={date:new Date().toISOString(),userAgent:navigator.userAgent,...data};out.textContent=JSON.stringify(report,null,2);out.dataset.report=JSON.stringify(report);document.querySelector('#save').disabled=false;};worker.onerror=e=>{out.textContent=e.message;b.disabled=false;worker.terminate();};worker.postMessage('run');};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='alto-m6-vector-comparison.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></html>
