name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      chrome_version:
        description: Chrome for Testing version (exact four-part version)
        default: '156.0.8078.47'
        type: string
      diagnostic_runner:
        description: Runner for the manual surface investigation (Linux remains experimental)
        default: macos-15
        type: choice
        options:
          - macos-15
          - ubuntu-24.04
      surface_recording:
        description: Record Canvas and WebGPU calls around the first surface fault
        default: false
        type: boolean
      verbose_gpu:
        description: Diagnostic opt-in - verbose GPU logging in the wasm-browser job
        default: false
        type: boolean
      present_timing:
        description: Diagnostic opt-in - record present timing in the wasm-browser job
        default: false
        type: boolean
      resize_barrier:
        description: Diagnostic only - wait for GPU submissions before applying SDK resize
        default: false
        type: boolean
      gpu_trace:
        description: Capture a bounded Chrome GPU command trace for diagnosis
        default: false
        type: boolean
      graphite_backend:
        description: Display compositor backend comparison (default keeps the production path)
        default: default
        type: choice
        options:
          - default
          - swiftshader
      lifecycle_mode:
        description: Run all lifetime probes or isolate queued GPU work
        default: all
        type: choice
        options:
          - all
          - backlog-resize
          - backlog-replace
          - unused-present
          - unused-replace
          - recorded-startup
      lifecycle_implementation:
        description: Surface isolation level (raw WebGPU, shipped WASM Runtime, or all SDK browser suites)
        default: webgpu
        type: choice
        options:
          - webgpu
          - wasm
          - sdk
          - startup
          - resize-stress
          - chrome-repro
      lifecycle_memory_mib:
        description: Texture allocation in the raw JavaScript probe (192 approximates Alto's initial atlases)
        default: '0'
        type: choice
        options:
          - '0'
          - '192'
      gpu_lifecycle:
        description: Run raw WebGPU surface lifetime probes on macOS and Linux
        default: false
        type: boolean
      behind_configs:
        description: chrome-repro configurations, comma-separated (empty keeps the default four)
        default: ''
        type: string
      gpu_watchdog:
        description: Keep Chrome's GPU watchdog enabled (disable only to investigate a timeout)
        default: true
        type: boolean

# One run per PR (or per ref, for main and workflow_dispatch). A new push
# cancels the older run instead of letting both finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.gpu_lifecycle }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      # ~/.cargo registry and git, plus this job's native target/.
      # cache-bin is off: installed binaries are not part of that set.
      # shared-key separates native and wasm build caches.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          cache-bin: "false"
          shared-key: native
      - name: Host rustfmt, tests, and clippy
        env:
          ALTO_ALPHA_MEASURE_OUT: ${{ runner.temp }}/alto-alpha-measure
        run: sh scripts/check.sh native
      - name: Record Metal semi-transparent parity
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/alto-alpha-measure/alpha-measure.md" ]; then
            cat "$RUNNER_TEMP/alto-alpha-measure/alpha-measure.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-alpha-measure/composite-v3.md" ]; then
            cat "$RUNNER_TEMP/alto-alpha-measure/composite-v3.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-alpha-measure/tie-8192.md" ]; then
            cat "$RUNNER_TEMP/alto-alpha-measure/tie-8192.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-alpha-measure/atlas-read.md" ]; then
            cat "$RUNNER_TEMP/alto-alpha-measure/atlas-read.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpha-measure-metal
          path: ${{ runner.temp }}/alto-alpha-measure
          if-no-files-found: ignore

  wasm:
    if: ${{ !inputs.gpu_lifecycle }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ALTO_WASM_TARGET_DIR: target/wasm-fast
      ALTO_BROWSER_SURFACE_RECORDING: ${{ inputs.surface_recording && '1' || '0' }}
      ALTO_BROWSER_RESIZE_BARRIER: ${{ inputs.resize_barrier && '1' || '0' }}
      ALTO_BROWSER_GPU_TRACE: ${{ inputs.gpu_trace && '1' || '0' }}
      ALTO_BROWSER_GRAPHITE_BACKEND: ${{ inputs.graphite_backend || 'default' }}
      CHROME_VERSION: ${{ inputs.chrome_version || '156.0.8078.47' }}
      ALTO_BROWSER_DISABLE_GPU_WATCHDOG: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_watchdog == false && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            packages/alto-sdk/pnpm-lock.yaml
            examples/*/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          cache-bin: "false"
          shared-key: wasm-fast
          workspaces: ". -> target/wasm-fast"
      - run: sh scripts/check.sh wasm-fast
      - name: Build vector package for the hash report
        if: ${{ !cancelled() }}
        run: sh scripts/build-vector-comparison.sh
      - name: Report proposed release-binary hashes and sizes
        if: ${{ !cancelled() }}
        run: node scripts/report-wasm-hashes.mjs "$RUNNER_TEMP/wasm-hashes"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wasm-hashes
          path: ${{ runner.temp }}/wasm-hashes

  # Independent cached rebuilds let browser/vector tests start without waiting
  # for wasm's clippy, API and Node checks or an artifact transfer.
  wasm-browser:
    if: ${{ !inputs.gpu_lifecycle }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ALTO_WASM_TARGET_DIR: target/wasm-fast
      ALTO_BROWSER_VERBOSE_GPU: ${{ inputs.verbose_gpu && '1' || '0' }}
      ALTO_BROWSER_PRESENT_TIMING: ${{ inputs.present_timing && '1' || '0' }}
      ALTO_BROWSER_SURFACE_RECORDING: ${{ inputs.surface_recording && '1' || '0' }}
      ALTO_BROWSER_RESIZE_BARRIER: ${{ inputs.resize_barrier && '1' || '0' }}
      ALTO_BROWSER_GPU_TRACE: ${{ inputs.gpu_trace && '1' || '0' }}
      ALTO_BROWSER_GRAPHITE_BACKEND: ${{ inputs.graphite_backend || 'default' }}
      CHROME_VERSION: ${{ inputs.chrome_version || '156.0.8078.47' }}
      ALTO_BROWSER_DISABLE_GPU_WATCHDOG: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_watchdog == false && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            packages/alto-sdk/pnpm-lock.yaml
            examples/*/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          cache-bin: "false"
          shared-key: wasm-fast
          save-if: false
          workspaces: ". -> target/wasm-fast"
      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          [[ "$CHROME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chrome_dir="$RUNNER_TEMP/alto-chrome"
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip" \
            --output "$RUNNER_TEMP/alto-chrome.zip"
          unzip -q "$RUNNER_TEMP/alto-chrome.zip" -d "$chrome_dir"
          chrome_executable="$chrome_dir/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome_executable" --version
          echo "CHROME=$chrome_executable" >> "$GITHUB_ENV"
          echo "ALTO_BROWSER_EXPECTED_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
      - name: Build WASM packages and SDK for browser tests
        run: |
          . ./scripts/wasm-repro-env.sh
          version=$(wasm_bindgen_version)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          sh scripts/build-m0.sh
          pnpm --dir packages/alto-sdk install --frozen-lockfile
          pnpm --dir packages/alto-sdk build
      - name: Run browser correctness suites
        env:
          ALTO_BROWSER_REPORT_DIR: ${{ runner.temp }}/alto-browser
          ALTO_BROWSER_GPU: swiftshader
        run: node scripts/verify-browser.mjs --functional
      - name: Record SwiftShader semi-transparent parity
        if: always()
        env:
          ALTO_BROWSER_REPORT_DIR: ${{ runner.temp }}/alto-browser
        run: |
          if [ -f "$ALTO_BROWSER_REPORT_DIR/parity.json" ]; then
            node scripts/alpha-measure-summary.mjs swiftshader \
              "$ALTO_BROWSER_REPORT_DIR/parity.json" \
              "$RUNNER_TEMP/alto-alpha-measure"
          else
            echo "parity.json missing; semi-transparent measurement was not recorded" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpha-measure-swiftshader
          path: ${{ runner.temp }}/alto-alpha-measure
          if-no-files-found: ignore
      - name: Build the embedding examples with Vite and run them
        env:
          ALTO_BROWSER_GPU: swiftshader
          ALTO_BROWSER_REPORT_DIR: ${{ runner.temp }}/alto-browser/examples
        run: sh scripts/check-examples.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alto-browser-reports-browser
          path: ${{ runner.temp }}/alto-browser
          if-no-files-found: ignore

  wasm-vector:
    if: ${{ !inputs.gpu_lifecycle }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ALTO_WASM_TARGET_DIR: target/wasm-fast
      ALTO_BROWSER_SURFACE_RECORDING: ${{ inputs.surface_recording && '1' || '0' }}
      ALTO_BROWSER_RESIZE_BARRIER: ${{ inputs.resize_barrier && '1' || '0' }}
      ALTO_BROWSER_GPU_TRACE: ${{ inputs.gpu_trace && '1' || '0' }}
      ALTO_BROWSER_GRAPHITE_BACKEND: ${{ inputs.graphite_backend || 'default' }}
      CHROME_VERSION: ${{ inputs.chrome_version || '156.0.8078.47' }}
      ALTO_BROWSER_DISABLE_GPU_WATCHDOG: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_watchdog == false && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            packages/alto-sdk/pnpm-lock.yaml
            examples/*/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          cache-bin: "false"
          shared-key: wasm-fast
          save-if: false
          workspaces: ". -> target/wasm-fast"
      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          [[ "$CHROME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chrome_dir="$RUNNER_TEMP/alto-chrome"
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip" \
            --output "$RUNNER_TEMP/alto-chrome.zip"
          unzip -q "$RUNNER_TEMP/alto-chrome.zip" -d "$chrome_dir"
          chrome_executable="$chrome_dir/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome_executable" --version
          echo "CHROME=$chrome_executable" >> "$GITHUB_ENV"
          echo "ALTO_BROWSER_EXPECTED_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
      - name: Build WASM packages and SDK for browser tests
        run: |
          . ./scripts/wasm-repro-env.sh
          version=$(wasm_bindgen_version)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          sh scripts/build-m0.sh
          pnpm --dir packages/alto-sdk install --frozen-lockfile
          pnpm --dir packages/alto-sdk build
      - name: Verify vector batching against legacy RGBA16F pixels
        if: ${{ !cancelled() }}
        env:
          ALTO_BROWSER_GPU: swiftshader
          ALTO_VECTOR_FRAMES: '1'
          ALTO_BROWSER_REPORT_DIR: ${{ runner.temp }}/alto-browser/vector
        run: |
          sh scripts/verify-wasm-sums.sh vector-comparison examples/vector-comparison/pkg committed || true
          sh scripts/build-vector-comparison.sh
          node scripts/verify-browser.mjs --vector-optimization
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alto-browser-reports-vector
          path: ${{ runner.temp }}/alto-browser
          if-no-files-found: ignore

  wasm-release-hashes:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Registry only: the release target is newly created under RUNNER_TEMP.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: wasm-registry
      - name: Check clean arm64 macOS release hashes before slow tests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$(uname -m)" = arm64
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'
          ALTO_WASM_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/alto-wasm-release.XXXXXX")
          export ALTO_WASM_TARGET_DIR
          sh scripts/check.sh wasm-release
      - name: Check clean main builds are reproducible
        if: github.ref == 'refs/heads/main'
        run: |
          test "$(uname -m)" = arm64
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'
          for trial in 1 2; do
            ALTO_WASM_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/alto-wasm-main.XXXXXX")
            ALTO_WASM_HASH_REPORT_DIR="$RUNNER_TEMP/wasm-hashes-main-$trial"
            export ALTO_WASM_TARGET_DIR ALTO_WASM_HASH_REPORT_DIR
            sh scripts/check.sh wasm-report
          done
          status=0
          for file in SHA256SUMS build-fields.json sizes.json; do
            diff -u "$RUNNER_TEMP/wasm-hashes-main-1/$file" "$RUNNER_TEMP/wasm-hashes-main-2/$file" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          name: wasm-hashes-main
          path: ${{ runner.temp }}/wasm-hashes-main-1
          if-no-files-found: error

  gpu-parity:
    if: ${{ !inputs.gpu_lifecycle }}
    # ubuntu-latest moves when GitHub retargets it, and that changes Mesa and lavapipe.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      # ~/.cargo registry and git, plus this job's native test target/.
      # The cache key includes the OS, so the macOS native target is not restored.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          cache-bin: "false"
          shared-key: gpu-parity
      - name: Install lavapipe and pin its ICD
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers
          mesa=$(dpkg-query -W -f '${Package} ${Version}' mesa-vulkan-drivers)
          mkdir -p "$RUNNER_TEMP/alto-gpu-parity"
          {
            echo "runner: ubuntu-24.04"
            echo "mesa-vulkan-drivers: $mesa"
          } > "$RUNNER_TEMP/alto-gpu-parity/driver.txt"
          {
            echo "### GPU parity driver"
            echo ""
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Mesa: \`$mesa\`"
          } >> "$GITHUB_STEP_SUMMARY"
          icd=$(find /usr/share/vulkan /usr/lib -name 'lvp_icd*.json' 2>/dev/null | head -n 1)
          if [ -z "$icd" ]; then
            echo "lavapipe ICD not found" >&2
            exit 1
          fi
          echo "icd: $icd" >> "$RUNNER_TEMP/alto-gpu-parity/driver.txt"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "MESA_VULKAN_DRIVERS=$mesa" >> "$GITHUB_ENV"
          echo "pinned lavapipe ICD: $icd"
          echo "mesa package: $mesa"
      - name: GPU versus CPU parity on lavapipe
        env:
          ALTO_REQUIRE_GPU_PARITY: "1"
          ALTO_REQUIRE_LAVAPIPE: "1"
          ALTO_ALPHA_MEASURE_OUT: ${{ runner.temp }}/alto-gpu-parity
        run: |
          log="$RUNNER_TEMP/alto-gpu-parity/parity.log"
          set +e
          cargo test -p alto-gpu --locked --lib cpu_composite::gpu_shader_matches_cpu_reference -- --exact --nocapture --test-threads=1 >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          # The harness already prints "gpu pixel parity adapter: llvmpipe (LLVM …) (Vulkan)".
          adapter=$(awk -F 'gpu pixel parity adapter: ' '/gpu pixel parity adapter: / { print $2; exit }' "$log")
          if [ -z "$adapter" ]; then
            adapter="(no adapter line)"
          fi
          echo "adapter: $adapter" >> "$RUNNER_TEMP/alto-gpu-parity/driver.txt"
          {
            echo "- Adapter: \`$adapter\`"
            echo "- Test exit: \`$status\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/alto-gpu-parity/alpha-measure.md" ]; then
            cat "$RUNNER_TEMP/alto-gpu-parity/alpha-measure.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-gpu-parity/composite-v3.md" ]; then
            cat "$RUNNER_TEMP/alto-gpu-parity/composite-v3.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-gpu-parity/tie-8192.md" ]; then
            cat "$RUNNER_TEMP/alto-gpu-parity/tie-8192.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/alto-gpu-parity/atlas-read.md" ]; then
            cat "$RUNNER_TEMP/alto-gpu-parity/atlas-read.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      # The v3 vector fill and blur renders through the headless Renderer, each
      # compared byte for byte with its Rust integer reference. Required: a
      # missing adapter fails instead of skipping.
      - name: v3 vector and blur parity on lavapipe
        env:
          ALTO_REQUIRE_GPU_PARITY: "1"
        run: |
          cargo test -p alto-gpu --locked --lib -- --test-threads=1 \
            cpu_composite::v3_vector_ cpu_composite::v3_blur_ cpu_composite::v3_raster_blur_ \
            cpu_composite::v3_backdrop_blur_ cpu_composite::v3_feathered_vector_mask_ \
            cpu_composite::v3_adjustment_vector_mask_
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-parity-report
          path: ${{ runner.temp }}/alto-gpu-parity
          if-no-files-found: ignore

  gpu-lifecycle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_lifecycle }}
    runs-on: ${{ inputs.diagnostic_runner || 'macos-15' }}
    timeout-minutes: 40
    env:
      ALTO_BROWSER_SURFACE_RECORDING: ${{ inputs.surface_recording && '1' || '0' }}
      ALTO_BROWSER_RESIZE_BARRIER: ${{ inputs.resize_barrier && '1' || '0' }}
      ALTO_BROWSER_GPU_TRACE: ${{ inputs.gpu_trace && '1' || '0' }}
      ALTO_BROWSER_GRAPHITE_BACKEND: ${{ (inputs.graphite_backend == 'swiftshader' || inputs.diagnostic_runner == 'ubuntu-24.04') && 'swiftshader' || 'default' }}
      CHROME_VERSION: ${{ inputs.chrome_version || '156.0.8078.47' }}
      ALTO_BROWSER_GPU: swiftshader
      ALTO_GPU_LIFECYCLE_CYCLES: ${{ (inputs.lifecycle_implementation == 'wasm' || inputs.lifecycle_mode == 'recorded-startup') && '20' || '120' }}
      ALTO_GPU_LIFECYCLE_MODE: ${{ inputs.lifecycle_mode || 'all' }}
      ALTO_GPU_LIFECYCLE_IMPLEMENTATION: ${{ inputs.lifecycle_implementation || 'webgpu' }}
      ALTO_GPU_LIFECYCLE_MEMORY_MIB: ${{ inputs.lifecycle_memory_mib || '0' }}
      ALTO_BEHIND_CONFIGS: ${{ inputs.behind_configs }}
      ALTO_BROWSER_EXPECTED_VERSION: ${{ inputs.chrome_version || '156.0.8078.47' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          [[ "$CHROME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$RUNNER_OS" in
            Linux) archive=linux64; executable=chrome-linux64/chrome ;;
            macOS) archive=mac-arm64; executable="chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/$archive/chrome-$archive.zip" \
            --output "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome/$executable" >> "$GITHUB_ENV"
      - name: Allow user namespaces for this Chrome executable on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Scope Ubuntu's exception to this ephemeral runner's pinned executable.
          printf 'abi <abi/4.0>,\nprofile alto-cft "%s" flags=(unconfined) { userns, }\n' \
            "$RUNNER_TEMP/chrome/chrome-linux64/chrome" | sudo tee /etc/apparmor.d/alto-cft
          sudo apparmor_parser -r /etc/apparmor.d/alto-cft
      # The WASM packages are not stored in git; the SDK suites and the Runtime
      # probes need them. Built here like scripts/check.sh does, on this runner.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: wasm-registry
      - name: Build the WASM packages
        shell: bash
        run: |
          export ALTO_WASM_TARGET_DIR="$RUNNER_TEMP/alto-wasm-target"
          version=$(sed -n 's/^wasm-bindgen *= *"=\([0-9][0-9.]*\)".*/\1/p' crates/alto-wasm/Cargo.toml)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
          sh scripts/build-m0.sh
      - name: Probe independent surface lifetime conditions
        shell: bash
        run: |
          if [[ "$ALTO_GPU_LIFECYCLE_IMPLEMENTATION" == startup ]]; then
            status=0
            # Independent fresh profiles, not retries that turn a failure green.
            for trial in 1 2 3 4 5; do
              ALTO_BROWSER_REPORT_DIR="$RUNNER_TEMP/lifecycle/startup-$trial" node scripts/verify-browser.mjs --startup-only || status=1
            done
            exit "$status"
          fi
          if [[ "$ALTO_GPU_LIFECYCLE_IMPLEMENTATION" == chrome-repro ]]; then
            # Plain WebGPU after crbug.com/557281760 (tests/diagnostics/behind-resize.html).
            # Exit 0 means the harness ran. It does not mean the loss failed to reproduce;
            # read summary `reproduced` / `reproduction`, not the green check.
            ALTO_BEHIND_SECONDS=90 ALTO_BEHIND_CONFIGS="${ALTO_BEHIND_CONFIGS:-worker-raf,worker-raf-inflight1,main-raf,worker-raf-light}" \
              ALTO_BROWSER_REPORT_DIR="$RUNNER_TEMP/lifecycle/behind" node scripts/verify-browser.mjs --behind-resize
            exit
          fi
          if [[ "$ALTO_GPU_LIFECYCLE_IMPLEMENTATION" == resize-stress ]]; then
            # Real container resizes under GPU load (tests/diagnostics/resize-stress.js).
            ALTO_BROWSER_REPORT_DIR="$RUNNER_TEMP/lifecycle/sdk" node scripts/verify-browser.mjs --suite=resize-stress
            exit
          fi
          if [[ "$ALTO_GPU_LIFECYCLE_IMPLEMENTATION" == sdk ]]; then
            ALTO_BROWSER_REPORT_DIR="$RUNNER_TEMP/lifecycle/sdk" node scripts/verify-browser.mjs --functional
            exit
          fi
          status=0
          modes="stable same-size resize same-size-burst resize-burst replace-abrupt replace-graceful recover recover-unconfigure"
          if [[ "$ALTO_GPU_LIFECYCLE_MODE" != all ]]; then modes="$ALTO_GPU_LIFECYCLE_MODE"; fi
          for mode in $modes; do
            ALTO_GPU_LIFECYCLE_MODE="$mode" ALTO_BROWSER_REPORT_DIR="$RUNNER_TEMP/lifecycle/$mode" \
              node scripts/verify-browser.mjs --gpu-lifecycle || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-lifecycle-${{ runner.os }}
          path: ${{ runner.temp }}/lifecycle
          if-no-files-found: error
