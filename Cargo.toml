[workspace]
resolver = "2"
members = ["crates/alto-core", "crates/alto-vector", "crates/alto-text", "crates/alto-raster", "crates/alto-doc", "crates/alto-store", "crates/alto-scene", "crates/alto-gpu", "crates/alto-engine", "crates/alto-git", "crates/alto-wasm"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Hash verification and tile decompression dominate recovery of large archives.
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.lz4_flex]
opt-level = 3
