[package]
name = "alto-doc"
version = "0.4.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
alto-vector = { path = "../alto-vector" }
alto-core = { path = "../alto-core" }
alto-raster = { path = "../alto-raster" }
alto-text = { path = "../alto-text" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
