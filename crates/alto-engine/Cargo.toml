[package]
name = "alto-engine"
version = "0.4.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
alto-vector = { path = "../alto-vector" }
alto-core = { path = "../alto-core" }
alto-doc = { path = "../alto-doc" }
alto-scene = { path = "../alto-scene" }
alto-raster = { path = "../alto-raster" }
thiserror = "2"
alto-store = { path = "../alto-store" }
alto-text = { path = "../alto-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Debug-only. Release builds ignore the request. Not enabled by the wasm package.
unstable-render-v3 = []

[dev-dependencies]
alto-raster = { path = "../alto-raster", features = ["test-hooks"] }
