[package]
name = "alto-core"
version = "0.4.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
# wasm32_simd only changes wasm32 builds: the same BLAKE3 digests from SIMD128
# code. Every browser with WebGPU also runs WASM SIMD. Package open and recovery
# verify every tile's hash, so the scalar version dominated those paths.
blake3 = { version = "1", features = ["wasm32_simd"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7", "js"] }

serde_json = "1"
