<!doctype html>
<meta charset="utf-8">
<title>Crash fixture</title>
<style>html, body { margin: 0; background: #fff; } #canvas { width: 256px; height: 256px; }</style>
<div id="canvas"></div>
<script type="module">
// One engine per tab, driven by tests/e2e/crash-tests.js over CDP. `prepare` leaves the
// engine at a wait point and returns what recovery must give; the runner then ends the
// tab and calls `recover` in a new tab of the same origin, so the same OPFS store.
import { createEngine, deleteRecovery, OpfsFolderProvider } from "../../packages/alto-sdk/dist/index.js";
import { testing } from "../../packages/alto-sdk/dist/testing.js";
import { unstable } from "../../packages/alto-sdk/dist/unstable.js";

const assert = (v, m) => { if (!v) throw Error(m); };
let engine = null;
// The provider the reopened folder came from: a save goes back through the same one.
let openedFolder = null;

async function start(namespace, storage = { namespace }) {
  engine = await createEngine({ container: document.querySelector("#canvas"), storage });
  return engine;
}
/** The OPFS folder a "folder-*" point saves to; one per namespace. */
const folderName = (namespace) => "crash-folder-" + namespace.replace(/[^A-Za-z0-9.-]/g, "_");
async function folderHandle(name, create = true) {
  return (await navigator.storage.getDirectory()).getDirectoryHandle(name, { create });
}
const never = () => new Promise(() => {});
/**
 * The OPFS folder provider, stopped at one storage call once `arm` is called. A stop
 * names the view method (`writeRef` or `deleteObjects`), the path for `writeRef`, which
 * matching call stops (`nth`, from 1) and when:
 * - "before": the call never runs;
 * - "mid": a `writeRef` runs the provider's own write, whose close (the atomic replace)
 *   never returns;
 * - "after": the call completes, then never returns.
 * `stopped` resolves at the stop. Stopping holds the folder lock until the tab ends, as
 * a dying save or GC would.
 */
async function stoppingFolder(name) {
  const handle = await folderHandle(name);
  const target = await OpfsFolderProvider.open(handle);
  let stop = null, seen = 0, reached;
  const stopped = new Promise((resolve) => (reached = resolve));
  const matches = (method, path) => {
    if (!stop || stop.method !== method || (stop.path && stop.path !== path)) return false;
    if (++seen < (stop.nth ?? 1)) return false;
    return true;
  };
  const at = async (when, call, file) => {
    stop = null;
    if (when === "before") { reached(); return never(); }
    if (when === "mid") {
      // The provider writes through createWritable(); its close replaces the file.
      const create = FileSystemFileHandle.prototype.createWritable;
      FileSystemFileHandle.prototype.createWritable = async function (...args) {
        const writable = await create.apply(this, args);
        if (this.name !== file) return writable;
        FileSystemFileHandle.prototype.createWritable = create;
        writable.close = () => (reached(), never());
        return writable;
      };
      return call();
    }
    await call();
    reached();
    return never();
  };
  const wrap = (view) => ({
    ...view,
    writeRef(path, data, expectHash) {
      const call = () => view.writeRef(path, data, expectHash);
      return matches("writeRef", path) ? at(stop.when, call, path.split("/").pop()) : call();
    },
    deleteObjects(paths) {
      const call = () => view.deleteObjects(paths);
      if (!matches("deleteObjects")) return call();
      if (stop.when === "mid") throw Error("a deletion has no mid stop");
      return at(stop.when, call);
    },
  });
  const provider = new Proxy(target, {
    get(t, key) {
      if (key === "exclusive") return (run) => t.exclusive((view) => run(wrap(view)));
      const value = t[key];
      return typeof value === "function" ? value.bind(t) : value;
    },
  });
  return { provider, arm: (s) => { stop = s; seen = 0; }, stopped };
}
/**
 * Runs `work` until the folder's armed stop. Work that fails or finishes first fails the
 * point instead of hanging it.
 */
async function untilStopped(folder, work) {
  await Promise.race([
    folder.stopped,
    work.then(() => { throw Error("the work finished before its stop"); }),
  ]);
}
/**
 * Every version the document can reach, by content: for each commit in the log, the
 * snapshot hash and tile map after restoring it. Restoring reads its objects, from the
 * folder when the document was opened from one. Each restore is undone again.
 */
async function roots(doc, layer) {
  const before = JSON.stringify(await state(doc, layer));
  const commits = (await doc.versions.log({ mode: "dag", allBranches: true })).map((c) => c.hash).sort();
  const out = [];
  for (const hash of commits) {
    await doc.versions.restore(hash);
    out.push([hash, await doc.snapshotHash(), JSON.stringify(await doc.nodeTiles(layer))]);
    await doc.undo();
  }
  assert(JSON.stringify(await state(doc, layer)) === before, "undoing the restores did not return to the same state");
  return JSON.stringify(out);
}
/** The commit files of `hashes` still in the folder. */
async function present(name, hashes) {
  const commits = await (await folderHandle(name, false)).getDirectoryHandle("commits");
  const out = [];
  for (const hash of hashes) if (await commits.getFileHandle(hash + ".json").then(() => true, () => false)) out.push(hash);
  return out;
}
/** GC stops: the manifest replacement (before, mid), deletions and the complete marker. */
const GC_STOPS = {
  "gc-before": { method: "writeRef", path: "manifest.json", when: "before" },
  "gc-mid": { method: "writeRef", path: "manifest.json", when: "mid" },
  "gc-delete": { method: "deleteObjects", nth: 2, when: "before" },
  "gc-complete": { method: "writeRef", path: ".alto-gc.json", nth: 2, when: "before" },
};
/**
 * What must survive: the snapshot hash, the state hash (content and version head), the
 * layer's tile map, the version history and that the work is still unsaved. `revision` is not compared: it counts edits
 * in this session and starts at 0 whenever a package loads, a checkpoint included.
 */
async function state(doc, layer) {
  return {
    hash: await doc.snapshotHash(),
    stateHash: doc.getSnapshot().stateHash,
    tiles: JSON.stringify(await doc.nodeTiles(layer)),
    log: JSON.stringify(await doc.versions.log({ mode: "dag", allBranches: true })),
    // Never saved to a file, so recovery must not present it as saved.
    dirty: doc.getSnapshot().dirty,
  };
}
function samples(seed, count = 24) {
  const out = [];
  for (let i = 0; i < count; i++)
    out.push({ x: 20 + ((seed * 37 + i * 9) % 200), y: 20 + ((seed * 53 + i * 7) % 200), pressure: 0.6, time: i * 8 });
  return out;
}
async function stroke(doc, layer, seed, color) {
  const tool = doc.tools.begin("brush", { layer, color, tip: { size: 18 } });
  for (const s of samples(seed)) tool.input(s);
  await tool.end();
}

/**
 * Two branches that both draw on the layer since "base": "side" also renames it, main
 * draws in another colour. Merging "side" into main conflicts; every conflict takes
 * "theirs". Returns the plan's commits and the state before the merge.
 */
async function branches(doc, layer, seed) {
  await doc.versions.commit("work " + seed);
  await doc.versions.createBranch("side", { checkout: true });
  await stroke(doc, layer, seed + 11, [0.1, 0.9, 0.9, 1]);
  await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "side " + seed }));
  const side = (await doc.versions.commit("side " + seed)).hash;
  await doc.versions.checkout("main");
  await stroke(doc, layer, seed + 12, [0.9, 0.5, 0.1, 1]);
  const main = (await doc.versions.commit("main " + seed)).hash;
  return { side, main };
}
async function merge(doc) {
  const plan = await doc.versions.prepareMerge("side");
  assert(plan.kind === "three_way", "the merge is not three-way: " + plan.kind);
  return { plan, finish: () => doc.versions.finishMerge(plan.token, plan.conflicts.map((c) => ({ conflict_id: c.id, choice: "theirs" })), { message: "merge side" }) };
}
/** The merge state checks: the version status and every commit's content. */
async function mergeState(doc, layer, wait = true) {
  const out = { ...(await state(doc, layer)), status: JSON.stringify(doc.versions.status()), roots: await roots(doc, layer) };
  // The restores and their Undos are journaled too: a crash must not land between them.
  // While writes are held they stay queued behind the merge instead.
  if (wait) await doc.durable();
  return out;
}
/** True once main's head is the two-parent merge of `side`. */
async function merged(doc, sides) {
  const head = (await doc.versions.log())[0];
  return head.parents.length === 2 && head.parents[0] === sides.main && head.parents[1] === sides.side;
}


/** Status changes, GPU events and diagnostics from now on, and the GPU losses this test caused. */
function watch() {
  const seen = { states: [], gpu: [], diagnostics: [], injected: 0 };
  engine.on("status", (s) => seen.states.push(s.state + (s.error ? ":" + s.error.code : "")));
  unstable(engine).onGpu((g) => seen.gpu.push(g));
  unstable(engine).onDiagnostic((d) => seen.diagnostics.push(String(d.message ?? "")));
  return seen;
}
const settled = (p) => p.then((value) => ({ ok: true, value }), (e) => ({ ok: false, code: e?.code, message: String(e?.message || e) }));
async function until(test, ms, what) {
  const t0 = performance.now();
  while (!test()) {
    if (performance.now() - t0 > ms) throw Error("timed out waiting for " + what);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}
const same = (a, b) => Object.keys(b).every((key) => a[key] === b[key]);
function differs(a, b) {
  return Object.keys(b).filter((key) => a[key] !== b[key]).join(", ");
}
/** A GPU loss nobody injected fails the test even when the engine recovered from it. */
function noUnexpectedLoss(seen) {
  const lost = seen.gpu.filter((g) => g === "lost").length;
  assert(lost === seen.injected, `${lost} GPU losses, ${seen.injected} injected: ${seen.gpu.join(", ")}`);
}
/** A stroke and a rename on top of the recovered state, then durable. */
async function editAfterFault(doc, layer, seed) {
  await stroke(doc, layer, seed + 7, [0.1, 0.7, 0.3, 1]);
  await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "after fault " + seed }));
  await doc.durable();
  return state(doc, layer);
}
// What a "worker-*", "storage-*" or "decode-*" point left for `afterFault`, after the runner's fault.
let faulting = null;

window.altoCrash = {
  /**
   * Builds a document with tiles and a version, makes it durable, then goes to `point`:
   * - "stroke-open": a stroke has drawn but not ended.
   * - "applied": a stroke and a rename are applied, and their journal write is held.
   * - "durable": the same edits, and `durable()` resolved.
   * - "journal-*": flush a torn or CRC-damaged record, then wait for termination.
   * - "checkpoint-*": with writes held, a rename (held as an append), a stroke and a
   *   commit, whose checkpoint replaces the two queued appends. On release the rename
   *   lands, then the checkpoint ends after its pack ("pack"), after a torn journal
   *   ("journal") or after a flushed journal whose reply is never taken ("flushed").
   * - "folder-*": a `.altoproj` save stops around its manifest replacement.
   * - "merge-*": a conflicting three-way merge is prepared but not finished
   *   ("prepared"), finished with its journal write held ("applied") or torn ("torn"),
   *   or finished and durable ("durable").
   * - "gc-*": a GC over a saved folder stops before or during its manifest replacement,
   *   after its first deletion, or before its complete marker.
   * - "worker-*", "storage-error", "decode-error", "gpu-*": with an applied edit whose
   *   journal write is held, the engine Worker throws (the runner does it, then calls
   *   `afterFault`), panics, or cannot load on restart; the Storage Worker or a decode
   *   Worker throws; or the GPU is lost under an open stroke or the held write. Checks
   *   the status and rejections the contract gives in the same tab, then a durable edit.
   * Returns the state recovery must give back.
   */
  async prepare(point, namespace, seed) {
    await start(namespace);
    const doc = await engine.createDocument({ width: 256, height: 256 });
    let layer;
    await doc.transact("layer.add", (tx) => (layer = tx.addRaster({ name: "paint" })));
    await stroke(doc, layer, seed, [0.9, 0.2, 0.1, 1]);
    await doc.versions.commit("base");
    await stroke(doc, layer, seed + 1, [0.1, 0.4, 0.9, 0.7]);
    await doc.durable();
    const base = await state(doc, layer);
    if (point === "stroke-open") {
      const tool = doc.tools.begin("brush", { layer, color: [0.2, 0.8, 0.2, 1], tip: { size: 30 } });
      for (const s of samples(seed + 2)) tool.input(s);
      await tool.flush();
      assert(tool.active, "the stroke ended early");
      return { layer, expected: base };
    }
    if (point.startsWith("folder-")) {
      // Saved once as v1, then v2's save stops around its manifest replacement.
      const name = folderName(namespace);
      const folder = await stoppingFolder(name);
      await doc.saveFolder(folder.provider);
      const v1 = { ...(await state(doc, layer)), dirty: false };
      await stroke(doc, layer, seed + 3, [0.6, 0.1, 0.8, 1]);
      await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "v2 " + seed }));
      await doc.versions.commit("v2 " + seed);
      // An opened folder is saved, so the reopened document is not dirty.
      const v2 = { ...(await state(doc, layer)), dirty: false };
      assert(v2.hash !== v1.hash && v2.log !== v1.log, "v2 did not change the document and history");
      const stage = point.slice("folder-".length);
      folder.arm({ method: "writeRef", path: "manifest.json", when: stage });
      await untilStopped(folder, doc.saveFolder(folder.provider));
      // The manifest is the commit point: replaced means v2, anything before means v1.
      return stage === "after"
        ? { layer, folder: name, expected: v2, lost: v1 }
        : { layer, folder: name, expected: v1, lost: v2 };
    }
    if (point.startsWith("gc-")) {
      // A saved folder with garbage: two commits only on branches since deleted. GC
      // stops partway; every root must read back the same, and a new GC must finish.
      const name = folderName(namespace);
      const folder = await stoppingFolder(name);
      const garbage = [];
      // Checkout needs a clean working state: commit the stroke made after "base".
      await doc.versions.commit("work " + seed);
      for (const branch of ["discard-a", "discard-b"]) {
        await doc.versions.createBranch(branch, { checkout: true });
        await stroke(doc, layer, seed + garbage.length + 5, [0.2, 0.9, 0.3, 1]);
        garbage.push((await doc.versions.commit(branch)).hash);
        await doc.versions.checkout("main");
      }
      await doc.versions.createBranch("kept");
      await doc.versions.deleteBranch("discard-a", { force: true });
      await doc.versions.deleteBranch("discard-b", { force: true });
      await stroke(doc, layer, seed + 9, [0.9, 0.8, 0.1, 1]);
      await doc.versions.commit("before GC " + seed);
      await doc.saveFolder(folder.provider);
      assert((await present(name, garbage)).length === 2, "the garbage was not saved");
      const preview = await doc.versions.gc();
      assert(preview.by_kind.commits.removed === 2, "GC does not see the garbage: " + JSON.stringify(preview.by_kind));
      const before = { ...(await state(doc, layer)), dirty: false, roots: await roots(doc, layer) };
      folder.arm(GC_STOPS[point]);
      await untilStopped(folder, doc.versions.gc({ dryRun: false, expectedBaseline: preview.baseline }));
      if (point === "gc-before" || point === "gc-mid") return { layer, folder: name, expected: before, garbage };
      // The replaced manifest is the commit point: the stopped GC already adopted it,
      // which moves the GC generation and so the state hash, and nothing else.
      const adopted = doc.getSnapshot().stateHash;
      assert(adopted !== before.stateHash, "adopting the GC did not move the state hash");
      return { layer, folder: name, expected: { ...before, stateHash: adopted }, lost: before, garbage };
    }
    if (point.startsWith("merge-")) {
      // A three-way merge with conflicts, ended before, while or after it is durable.
      const t = testing(engine);
      const sides = await branches(doc, layer, seed);
      await doc.durable();
      const before = await mergeState(doc, layer);
      const { plan, finish } = await merge(doc);
      assert(plan.conflicts.length > 0, "the merge has no conflicts");
      if (point === "merge-prepared") return { layer, expected: before, merge: sides };
      if (point !== "merge-durable") await t.holdStorage(true);
      const generation = (await t.recoveryStore()).latestGeneration;
      const result = await finish();
      assert(result.kind === "committed" && await merged(doc, sides), "the merge did not commit two parents");
      const after = await mergeState(doc, layer, point === "merge-durable");
      assert(after.hash !== before.hash && after.log !== before.log, "the merge did not change the document and history");
      if (point === "merge-durable") {
        await doc.durable();
        // A merge is journaled, not checkpointed: recovery replays its record.
        assert((await t.recoveryStore()).latestGeneration === generation, "a checkpoint replaced the merge record");
        return { layer, expected: after, merge: sides };
      }
      const kind = await t.storageHeld();
      assert(kind === "append", "the held write is a " + kind);
      if (point === "merge-torn") {
        await t.partialAppend("payload");
        await t.holdStorage(false);
        await t.partialAppendHeld();
      }
      return { layer, expected: before, lost: after, merge: sides };
    }
    if (point.startsWith("checkpoint-")) {
      const stage = point.slice("checkpoint-".length);
      const t = testing(engine);
      await t.holdStorage(true);
      await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "renamed " + seed }));
      const kind = await t.storageHeld();
      assert(kind === "append", "the held write is a " + kind);
      // The previous generation plus the held rename: what the old journal recovers.
      const renamed = await state(doc, layer);
      await stroke(doc, layer, seed + 3, [0.6, 0.1, 0.8, 1]);
      await doc.versions.commit("checkpoint " + seed);
      const committed = await state(doc, layer);
      assert(committed.hash !== renamed.hash, "the stroke did not change the document");
      assert(committed.log !== renamed.log, "the commit did not change the history");
      await t.stopCheckpoint(stage);
      await t.holdStorage(false);
      await t.checkpointStopped();
      // A flushed journal is a complete generation, newer than the previous one. Its
      // previous state was durable too, so it is not reported as never durable.
      return stage === "flushed"
        ? { layer, expected: committed }
        : { layer, expected: renamed, lost: committed };
    }
    if (/^(worker|storage|decode|gpu)-/.test(point)) {
      const t = testing(engine);
      const seen = watch();
      if (point === "gpu-stroke") {
        // The device is lost under an open stroke: the stroke ends with GPU_LOST, the
        // document keeps what it had, and drawing works on the rebuilt device.
        const tool = doc.tools.begin("brush", { layer, color: [0.2, 0.8, 0.2, 1], tip: { size: 30 } });
        for (const s of samples(seed + 2)) tool.input(s);
        await tool.flush();
        assert(tool.active, "the stroke ended early");
        seen.injected++;
        await t.destroyGpu();
        const ended = await settled(tool.end());
        assert(!ended.ok && ended.code === "GPU_LOST", "the cut stroke ended with " + JSON.stringify(ended));
        await until(() => seen.gpu.includes("restored"), 15000, "the GPU to be restored");
        const now = await state(doc, layer);
        assert(same(now, base), "the cut stroke changed the document in " + differs(now, base));
        const expected = await editAfterFault(doc, layer, seed);
        noUnexpectedLoss(seen);
        return { layer, expected };
      }
      if (point === "decode-error") {
        // A decode Worker throws: the pool stops and decoding goes inline. The engine
        // Worker keeps running, so nothing restarts and no edit is lost.
        faulting = { point, doc, layer, seed, seen, base };
        return { layer, inject: "decode" };
      }
      // An applied edit whose journal write is held: never durable.
      await t.holdStorage(true);
      await stroke(doc, layer, seed + 3, [0.6, 0.1, 0.8, 1]);
      await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "renamed " + seed }));
      const after = await state(doc, layer);
      assert((await t.storageHeld()) === "append", "no journal write is held");
      if (point === "gpu-held") {
        // A device loss does not touch the journal: the held edit lands once released.
        seen.injected++;
        await t.destroyGpu();
        await until(() => seen.gpu.includes("restored"), 15000, "the GPU to be restored");
        const now = await state(doc, layer);
        assert(same(now, after), "the GPU loss changed the document in " + differs(now, after));
        await t.holdStorage(false);
        await doc.durable();
        noUnexpectedLoss(seen);
        return { layer, expected: await editAfterFault(doc, layer, seed) };
      }
      const held = settled(doc.durable());
      faulting = { point, doc, layer, seed, seen, base, after, held };
      if (point === "worker-panic") {
        const panicked = await settled(t.panic());
        assert(!panicked.ok && panicked.code === "WORKER_CRASHED", "the panicking request ended with " + JSON.stringify(panicked));
        return { layer, ...(await window.altoCrash.afterFault()) };
      }
      if (point === "worker-failed") {
        // The restarted Worker cannot load: the engine fails, refuses edits, and the tab
        // ends in that state. The new tab recovers the journal.
        t.setWorkerURL("/missing-alto-engine-worker.js");
        const restarted = await settled(t.crash());
        t.setWorkerURL(null);
        assert(!restarted.ok && restarted.code === "WORKER_UNAVAILABLE", "the failed restart ended with " + JSON.stringify(restarted));
        assert(engine.status.state === "failed" && engine.status.error, "the engine is " + engine.status.state);
        const refused = await settled(doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "refused" })));
        assert(!refused.ok && refused.code === "WORKER_UNAVAILABLE", "an edit while failed ended with " + JSON.stringify(refused));
        const durable = await held;
        assert(!durable.ok, "durable() resolved for a write the Worker never made");
        noUnexpectedLoss(seen);
        return { layer, expected: base, lost: after };
      }
      // "worker-error", "storage-error": the runner throws inside the Worker, then calls afterFault.
      return { layer, inject: point === "storage-error" ? "storage" : "engine" };
    }
    const journal = point.startsWith("journal-");
    if (point === "applied" || journal) await testing(engine).holdStorage(true);
    await stroke(doc, layer, seed + 3, [0.6, 0.1, 0.8, 1]);
    await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "renamed " + seed }));
    const after = await state(doc, layer);
    assert(after.hash !== base.hash, "the edits did not change the document");
    if (point === "applied" || journal) {
      const kind = await testing(engine).storageHeld();
      assert(kind === "append", "the held write is a " + kind);
      if (journal) {
        await testing(engine).partialAppend(point.slice("journal-".length));
        await testing(engine).holdStorage(false);
        await testing(engine).partialAppendHeld();
      }
      return { layer, expected: base, lost: after };
    }
    await doc.durable();
    return { layer, expected: after };
  },
  /**
   * After an uncaught error in the engine Worker (or a panic), the Storage Worker or a
   * decode Worker: checks the status sequence and what the document holds, then makes
   * a durable edit.
   */
  async afterFault() {
    const { point, doc, layer, seed, seen, base, after, held } = faulting;
    faulting = null;
    if (point === "decode-error") {
      await until(() => seen.diagnostics.some((m) => m.startsWith("decode workers stopped")), 15000, "the decode pool to stop");
      // Any restart the error caused would have begun by the time its diagnostic arrived.
      await unstable(engine).settle();
      assert(!seen.states.length, "a decode Worker error changed the engine status: " + seen.states.join(", "));
      const now = await state(doc, layer);
      assert(same(now, base), "the document differs in " + differs(now, base));
      const expected = await editAfterFault(doc, layer, seed);
      noUnexpectedLoss(seen);
      return { expected };
    }
    if (point === "storage-error") {
      await until(() => engine.status.state === "storage-failed", 15000, "storage-failed");
      assert(engine.status.error?.code === "STORAGE", "storage failed with " + engine.status.error?.code);
      // It stays failed: the engine does not restart on its own and drop the live document.
      await unstable(engine).settle();
      assert(seen.states.join() === "storage-failed:STORAGE", "the storage failure went through " + seen.states.join(", "));
      // The failure rejects every durable() waiting, the held write's included.
      const durable = await held;
      assert(!durable.ok, "durable() resolved after the Storage Worker died");
      const refused = await settled(doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "refused" })));
      assert(!refused.ok && refused.code === "STORAGE", "an edit after the storage failure ended with " + JSON.stringify(refused));
      // The live document is still there to export.
      const emergency = await engine.recovery.exportEmergency();
      assert(emergency.size > 0, "the emergency export is empty");
      const report = await engine.recovery.recoverAfterStorageFailure();
      assert(report.document === doc && report.matchesDisplay === false, "recovery reported " + JSON.stringify({ same: report.document === doc, matches: report.matchesDisplay }));
    } else {
      await until(() => engine.status.state === "ready" && seen.states.includes("restarting"), 30000, "the Worker restart");
      const durable = await held;
      assert(!durable.ok && durable.code === "WORKER_CRASHED", "durable() across the crash ended with " + JSON.stringify(durable));
      assert(engine.document === doc, "the restart replaced the document handle");
    }
    assert(engine.status.state === "ready" && !engine.status.error, "the engine is " + engine.status.state);
    const last = seen.states.at(-1);
    assert(last === "ready", "the last status is " + last + " of " + seen.states.join(", "));
    const now = await state(doc, layer);
    assert(same(now, base), "recovery in the same tab differs in " + differs(now, base));
    const expected = await editAfterFault(doc, layer, seed);
    noUnexpectedLoss(seen);
    return { expected, lost: after };
  },
  /**
   * Opens the namespace again after the crash and restores its journal. With `folder`,
   * opens that folder instead, in an engine that keeps no journal.
   */
  async recover(namespace, layer, folder = null, gc = false, merging = false) {
    if (folder) {
      await start(namespace, { recovery: false });
      openedFolder = await OpfsFolderProvider.open(await folderHandle(folder, false));
      const doc = await engine.openFolder(openedFolder);
      const out = await state(doc, layer);
      return gc ? { ...out, roots: await roots(doc, layer) } : out;
    }
    await start(namespace);
    assert(engine.recovery.available, "no recovery journal is waiting");
    const doc = await engine.recovery.restore();
    return merging ? mergeState(doc, layer) : state(doc, layer);
  },
  /**
   * A durable edit after recovery; with `commit`, also a checkpoint over the old files.
   * With `garbage`, a GC over the reopened folder instead, which must remove it all.
   */
  async editAfterRecovery(layer, commit = false, folder = null, garbage = null, sides = null) {
    const doc = engine.document;
    assert(doc, "document is not open");
    if (sides) {
      // Merge again if the crash lost it, else draw and commit on top of the merge.
      if (!(await merged(doc, sides))) {
        const result = await (await merge(doc)).finish();
        assert(result.kind === "committed" && await merged(doc, sides), "the merge after recovery did not commit two parents");
      } else {
        await stroke(doc, layer, 99, [0.3, 0.3, 0.3, 1]);
        await doc.versions.commit("after recovery");
      }
      await doc.durable();
      return mergeState(doc, layer);
    }
    if (folder && garbage) {
      // GC again over what the stopped one left; it must finish and remove the rest.
      const preview = await doc.versions.gc();
      const before = doc.getSnapshot().stateHash;
      const report = await doc.versions.gc({ dryRun: false, expectedBaseline: preview.baseline });
      assert(!report.dry_run && !doc.getSnapshot().dirty, "the second GC did not finish clean");
      assert(doc.getSnapshot().stateHash !== before, "the second GC did not adopt a new manifest");
      const marker = await (await (await folderHandle(folder, false)).getFileHandle(".alto-gc.json")).getFile();
      assert(JSON.parse(await marker.text()).phase === "complete", "the second GC left no complete marker");
      const left = await present(folder, garbage);
      assert(!left.length, "GC left garbage: " + left.join(", "));
      return { ...(await state(doc, layer)), roots: await roots(doc, layer) };
    }
    await doc.transact("layer.props", (tx) => tx.setProps(layer, { name: "after-recovery" }));
    if (commit || folder) await doc.versions.commit("after recovery");
    // Saving into the folder the dead tab left, with its lock and any partial write.
    if (folder) {
      await doc.saveFolder(openedFolder);
      return state(doc, layer);
    }
    await doc.durable();
    return state(doc, layer);
  },
  async cleanUp(namespace, folder = null) {
    await engine?.dispose();
    engine = null;
    await deleteRecovery(namespace);
    if (folder) await (await navigator.storage.getDirectory()).removeEntry(folder, { recursive: true });
  },
};
window.altoCrashReady = true;
</script>
