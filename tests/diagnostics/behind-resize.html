<!doctype html>
<meta charset="utf-8">
<title>WebGPU resize while the GPU is behind</title>
<style>body { margin: 0; } #host { width: 900px; height: 500px; } canvas { display: block; width: 100%; height: 100%; }</style>
<div id="host"><canvas id="canvas"></canvas></div>
<script type="module">
import { start } from "./behind-resize-render.js";

// options: { thread: "worker" | "main", loop: "raf" | "task", light, inflight, targetMs, big, seconds }
window.runBehindResize = async (options) => {
  const host = document.getElementById("host");
  const canvas = document.getElementById("canvas");
  const events = [];
  let resize, stop, lostAt = null;
  const onEvent = (event) => { events.push(event); if (event.t === "lost") lostAt = event.atMs; };
  // Calibrate at the real size, not the 300x150 default.
  const [low, high, tall] = options.big ? [1400, 1800, 1000] : [700, 1100, 500];
  host.style.width = (low + high) / 2 + "px"; host.style.height = tall + "px";
  canvas.width = (low + high) / 2; canvas.height = tall;
  if (options.thread === "worker") {
    const worker = new Worker("./behind-resize-worker.js", { type: "module" });
    const offscreen = canvas.transferControlToOffscreen();
    const replies = [];
    worker.onmessage = ({ data }) => { if (data.t === "lost" || data.t === "validation") onEvent(data); else replies.push(data); };
    const next = async (kind) => {
      for (;;) {
        const i = replies.findIndex((r) => r.t === kind || r.t === "error");
        if (i >= 0) { const r = replies.splice(i, 1)[0]; if (r.t === "error") throw Error(r.message); return r; }
        await new Promise((r) => setTimeout(r, 10));
      }
    };
    worker.postMessage({ t: "start", canvas: offscreen, options }, [offscreen]);
    await next("started");
    resize = (width, height) => worker.postMessage({ t: "resize", width, height });
    stop = async () => { worker.postMessage({ t: "stop" }); const s = (await next("stats")).value; worker.terminate(); return s; };
  } else {
    const loop = await start(canvas, options, onEvent);
    resize = loop.resize;
    stop = async () => loop.stop();
  }
  // What the SDK and the report both do: the backing store follows the element.
  new ResizeObserver(([entry]) => {
    const box = entry.devicePixelContentBoxSize?.[0];
    resize(Math.max(1, box ? box.inlineSize : Math.round(entry.contentRect.width)),
      Math.max(1, box ? box.blockSize : Math.round(entry.contentRect.height)));
  }).observe(canvas, { box: "device-pixel-content-box" });
  // Sweep between `low` and `high` px wide in 60 px steps every 40 ms, pausing 300 ms at each end.
  const started = performance.now();
  let width = (low + high) / 2, step = 60;
  while (performance.now() - started < options.seconds * 1000 && lostAt === null) {
    width += step;
    if (width >= high || width <= low) { step = -step; await new Promise((r) => setTimeout(r, 300)); }
    host.style.width = width + "px";
    host.style.height = (width % 120 === 0 ? tall : tall + 3) + "px";
    await new Promise((r) => setTimeout(r, 40));
  }
  if (lostAt !== null) await new Promise((r) => setTimeout(r, 500));
  const stats = await stop();
  return { options, elapsedMs: Math.round(performance.now() - started), stats, events: events.slice(0, 20) };
};
</script>
